name: はてなブログ自動投稿

on:
  schedule:
    # 毎日 09:00 JST (00:00 UTC) に実行。必要に応じて変更してください。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      posts_per_run:
        description: "今回投稿する件数"
        required: false
        default: "1"

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 記事を投稿
        env:
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          POSTS_PER_RUN: ${{ github.event.inputs.posts_per_run || '1' }}
          DRAFT: "true"
        run: node scripts/post-to-hatena.js

      - name: 投稿ログをコミット
        run: |
          git config user.name "hatena-auto-post-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/posted-log.json
          git diff --cached --quiet || git commit -m "chore: update posted-log.json"
          git push
